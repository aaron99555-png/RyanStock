<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飆股小瑪莉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 4px;
            width: 100%;
            height: 100%;
        }
        .pos-0 { grid-area: 1 / 1; } .pos-1 { grid-area: 1 / 2; } .pos-2 { grid-area: 1 / 3; }
        .pos-3 { grid-area: 1 / 4; } .pos-4 { grid-area: 1 / 5; } .pos-5 { grid-area: 1 / 6; }
        .pos-6 { grid-area: 1 / 7; } .pos-7 { grid-area: 2 / 7; } .pos-8 { grid-area: 3 / 7; }
        .pos-9 { grid-area: 4 / 7; } .pos-10 { grid-area: 5 / 7; } .pos-11 { grid-area: 6 / 7; }
        .pos-12 { grid-area: 7 / 7; } .pos-13 { grid-area: 7 / 6; } .pos-14 { grid-area: 7 / 5; }
        .pos-15 { grid-area: 7 / 4; } .pos-16 { grid-area: 7 / 3; } .pos-17 { grid-area: 7 / 2; }
        .pos-18 { grid-area: 7 / 1; } .pos-19 { grid-area: 6 / 1; } .pos-20 { grid-area: 5 / 1; }
        .pos-21 { grid-area: 4 / 1; } .pos-22 { grid-area: 3 / 1; } .pos-23 { grid-area: 2 / 1; }
    </style>
</head>
<body class="h-[100dvh] w-full bg-gray-900 flex flex-col items-center justify-between p-2 font-sans text-white overflow-hidden m-0">

    <div class="flex-shrink-0 w-full text-center pt-2">
        <h1 class="text-3xl font-black text-yellow-400 drop-shadow-[0_0_10px_rgba(255,0,0,0.8)] tracking-widest">飆股小瑪莉</h1>
        <div class="text-lg font-bold text-yellow-200">資本: <span id="chips-display">$5000</span></div>
    </div>

    <div class="flex-1 w-full max-w-lg flex items-center justify-center p-2">
        <div id="game-board" class="grid-container bg-gray-800 p-2 rounded-2xl border-4 border-gray-700 shadow-2xl">
            <div class="col-start-2 col-end-7 row-start-2 row-end-7 bg-black flex items-center justify-center rounded-lg border-2 border-gray-600">
                <h2 id="center-message" class="text-lg font-bold text-center text-white px-2">請下單！</h2>
            </div>
        </div>
    </div>

    <div class="flex-shrink-0 w-full pb-6 flex flex-col items-center gap-3">
        <div class="flex items-center gap-4 bg-gray-800 p-3 rounded-xl border border-gray-600">
            <button onclick="changeBet(-100)" class="px-6 py-2 bg-gray-700 rounded font-bold">-100</button>
            <div id="current-bet-display" class="w-20 text-center font-black text-xl">100</div>
            <button onclick="changeBet(100)" class="px-6 py-2 bg-gray-700 rounded font-bold">+100</button>
        </div>
        <button id="spin-btn" onclick="startSpin()" class="px-10 py-4 bg-red-600 rounded-full font-black text-xl shadow-[0_5px_0_#991b1b] active:shadow-none active:translate-y-[5px] transition-all">確認啟動</button>
    </div>

    <script>
        const GAME_ITEMS = [
            { name: 'TSMC', type: 'stock', color: 'bg-red-600' }, { name: '跌停', type: 'bad', color: 'bg-green-600' },
            { name: '鴻海', type: 'stock', color: 'bg-blue-700' }, { name: '跳空鎖死', type: 'good', color: 'bg-red-500' },
            { name: '聯發科', type: 'stock', color: 'bg-red-500' }, { name: '外資倒貨', type: 'bad', color: 'bg-green-500' },
            { name: '財富對哲', type: 'zhezhe', color: 'bg-cyan-600' }, { name: '軋空', type: 'good', color: 'bg-pink-600' },
            { name: '南亞科', type: 'stock', color: 'bg-blue-600' }, { name: '漲停', type: 'good', color: 'bg-red-600' },
            { name: '胖手指', type: 'bad', color: 'bg-green-800' }, { name: '違約交割', type: 'bad', color: 'bg-gray-900' },
            { name: '國巨', type: 'stock', color: 'bg-teal-600' }, { name: '投信連買', type: 'good', color: 'bg-pink-400' },
            { name: '無量下跌', type: 'bad', color: 'bg-green-400' }, { name: '融資斷頭', type: 'bad', color: 'bg-green-700' },
            { name: '金爺降臨', type: 'jackpot', color: 'bg-yellow-300' }, { name: '法會大跌', type: 'bad', color: 'bg-emerald-900' },
            { name: '直雲家族', type: 'super_bad', color: 'bg-purple-900' }, { name: '漲停', type: 'good', color: 'bg-red-600' },
            { name: '尖點', type: 'stock', color: 'bg-indigo-500' }, { name: '量價背離', type: 'bad', color: 'bg-green-700' },
            { name: '高檔倒貨', type: 'bad', color: 'bg-green-600' }, { name: '跌停', type: 'bad', color: 'bg-green-600' }
        ];

        let chips = 5000, currentBet = 100, isSpinning = false, currentIndex = 0;
        const synth = new Tone.PolySynth().toDestination();
        synth.volume.value = 10;

        function initBoard() {
            const board = document.getElementById('game-board');
            GAME_ITEMS.forEach((item, i) => {
                const el = document.createElement('div');
                el.id = 'item-' + i;
                el.className = `pos-${i} ${item.color} flex items-center justify-center text-[10px] sm:text-xs font-bold rounded shadow-inner border border-black p-1 text-center`;
                el.innerHTML = item.name;
                board.appendChild(el);
            });
        }

        async function startSpin() {
            if(isSpinning || chips < currentBet) return;
            await Tone.start();
            chips -= currentBet;
            document.getElementById('chips-display').innerText = '$' + chips;
            isSpinning = true;
            let steps = 50 + Math.floor(Math.random() * 24);
            let speed = 50;
            
            function move() {
                document.querySelectorAll('.grid-container > div').forEach(el => el.classList.remove('ring-4', 'ring-yellow-300', 'z-10'));
                let currentEl = document.getElementById('item-' + (currentIndex % 24));
                currentEl.classList.add('ring-4', 'ring-yellow-300', 'z-10');
                
                synth.triggerAttackRelease("C4", "32n");
                currentIndex++;
                
                if(--steps > 0) setTimeout(move, speed += 2);
                else {
                    isSpinning = false;
                    checkResult(GAME_ITEMS[(currentIndex - 1) % 24]);
                }
            }
            move();
        }

        function checkResult(item) {
            let msg = item.name;
            if(item.type === 'good') chips += currentBet * 2;
            else if(item.type === 'bad') chips -= currentBet * 2;
            else if(item.type === 'super_bad') chips -= currentBet * 10;
            else if(item.type === 'zhezhe') chips = Math.floor(chips / 2);
            else if(item.type === 'jackpot') chips += currentBet * 50;
            else chips += currentBet;
            
            document.getElementById('chips-display').innerText = '$' + chips;
            document.getElementById('center-message').innerText = msg;
        }

        function changeBet(amt) {
            currentBet = Math.max(100, currentBet + amt);
            document.getElementById('current-bet-display').innerText = currentBet;
        }

        initBoard();
    </script>
</body>
</html>
