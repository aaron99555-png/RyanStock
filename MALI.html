<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飆股小瑪莉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #0f172a; overflow: hidden; touch-action: manipulation; font-family: 'Arial Black', sans-serif; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 4px;
            width: 95vmin;
            height: 95vmin;
            max-width: 600px;
            max-height: 600px;
        }
        .item { 
            display: flex; align-items: center; justify-content: center; text-align: center; 
            font-size: 11px; font-weight: 900; border-radius: 8px; border: 3px solid #334155; 
            transition: all 0.1s; color: white; padding: 4px; cursor: pointer;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3);
        }
        .active { transform: scale(1.15); box-shadow: 0 0 30px #fbbf24; border-color: white !important; z-index: 20; filter: brightness(1.8) saturate(1.5); }
        #center-stage { grid-column: 2 / 7; grid-row: 2 / 7; border: 6px solid #475569; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fbbf24; padding: 20px; text-align: center; box-shadow: inset 0 0 20px #000; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .shake { animation: shake 0.2s infinite; background-color: #064e3b !important; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .flash { animation: flash 0.3s infinite; background-color: #991b1b !important; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col items-center justify-between p-2">

    <div class="text-center pt-2">
        <h1 class="text-4xl font-black text-yellow-400 drop-shadow-xl tracking-widest">飆股小瑪莉</h1>
        <div class="text-2xl font-black text-white mt-1">資本: <span id="chips-display" class="text-yellow-300">5000</span></div>
    </div>

    <div class="flex-1 flex items-center justify-center">
        <div id="game-board" class="grid-container bg-slate-950 p-2 rounded-2xl border-4 border-slate-700"></div>
    </div>

    <script>
        const ITEMS = [
            { name: 'TSMC', type: 'stock', color: 'bg-red-600' }, { name: '漲停', type: 'good', color: 'bg-red-600' },
            { name: '鴻海', type: 'stock', color: 'bg-blue-600' }, { name: '軋空行情', type: 'good', color: 'bg-pink-500' },
            { name: '聯發科', type: 'stock', color: 'bg-red-500' }, { name: '投信連買', type: 'good', color: 'bg-pink-600' },
            { name: '國巨', type: 'stock', color: 'bg-teal-600' }, { name: '跳空鎖死', type: 'good', color: 'bg-red-500' },
            { name: '南亞科', type: 'stock', color: 'bg-blue-600' }, { name: '漲停', type: 'good', color: 'bg-red-600' },
            { name: '尖點', type: 'stock', color: 'bg-indigo-600' }, { name: '金爺降臨', type: 'jackpot', color: 'bg-yellow-400' },
            { name: '台達電', type: 'stock', color: 'bg-blue-700' }, { name: '外資倒貨', type: 'bad', color: 'bg-green-500' },
            { name: '華碩', type: 'stock', color: 'bg-blue-400' }, { name: '胖手指', type: 'bad', color: 'bg-green-700' },
            { name: '聯電', type: 'stock', color: 'bg-orange-500' }, { name: '高檔倒貨', type: 'bad', color: 'bg-green-500' },
            { name: '長榮', type: 'stock', color: 'bg-teal-700' }, { name: '相信哲哲', type: 'zhezhe', color: 'bg-cyan-600' },
            { name: '廣達', type: 'stock', color: 'bg-blue-500' }, { name: '融資斷頭', type: 'bad', color: 'bg-green-800' },
            { name: '法會大跌', type: 'bad', color: 'bg-green-600' }, { name: '直雲大家族', type: 'super_bad', color: 'bg-black' }
        ];

        let chips = 5000, bet = 100, isSpinning = false;
        const board = document.getElementById('game-board');

        function init() {
            const layout = [
                0, 1, 2, 3, 4, 5, 6,
                23, null, null, null, null, null, 7,
                22, null, null, null, null, null, 8,
                21, null, null, null, null, null, 9,
                20, null, null, null, null, null, 10,
                19, null, null, null, null, null, 11,
                18, 17, 16, 15, 14, 13, 12
            ];
            layout.forEach((idx) => {
                if(idx !== null) {
                    const el = document.createElement('div');
                    el.className = `item ${ITEMS[idx].color}`;
                    el.id = `item-${idx}`;
                    el.innerHTML = ITEMS[idx].name;
                    board.appendChild(el);
                }
            });
            board.innerHTML += `<div id="center-stage" class="bg-slate-900">請確認下注</div>`;
        }

        function changeBet(val) {
            if(isSpinning) return;
            if(val === 99999) bet = chips;
            else bet = Math.max(100, Math.min(chips, bet + val));
            document.getElementById('bet-display').textContent = bet;
            document.getElementById('start-btn').textContent = `確認啟動 (${bet}點)`;
        }

        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            if(type === 'spin') { osc.type = 'square'; osc.frequency.value = 200; g.gain.value = 0.05; osc.start(); osc.stop(ctx.currentTime + 0.05); }
            else if(type === 'win') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, ctx.currentTime); osc.frequency.linearRampToValueAtTime(800, ctx.currentTime + 0.2); g.gain.value = 0.2; osc.start(); osc.stop(ctx.currentTime + 0.3); }
            else { osc.type = 'sawtooth'; osc.frequency.value = 80; g.gain.value = 0.2; osc.start(); osc.stop(ctx.currentTime + 0.4); }
        }

        async function startSpin() {
            if(isSpinning || chips < bet) return;
            isSpinning = true; chips -= bet;
            document.getElementById('chips-display').textContent = chips;
            let pos = 0, steps = 40 + Math.floor(Math.random() * 20);
            function loop() {
                document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
                const currentId = pos % 24;
                document.getElementById(`item-${currentId}`).classList.add('active');
                playSfx('spin');
                pos++; steps--;
                if(steps > 0) setTimeout(loop, 30 + (steps * 3));
                else { isSpinning = false; finish(currentId); }
            }
            loop();
        }

        function finish(idx) {
            const item = ITEMS[idx];
            let delta = 0, msg = "";
            if(item.type === 'jackpot') { delta = bet * 50; msg = "金爺降臨！大獎！"; document.getElementById('center-stage').classList.add('flash'); playSfx('win'); }
            else if(item.type === 'good') { delta = bet * 4; msg = "賺錢囉！"; playSfx('win'); }
            else if(item.type === 'bad') { delta = -bet * 2; msg = "賠錢..."; document.getElementById('center-stage').classList.add('shake'); playSfx('lose'); }
            else if(item.type === 'super_bad') { delta = -5000; msg = "直雲大家族！"; document.getElementById('center-stage').classList.add('shake'); playSfx('lose'); }
            else if(item.type === 'zhezhe') { delta = -Math.floor(chips / 2); msg = "財富對折！"; playSfx('lose'); }
            chips += (delta + bet);
            document.getElementById('chips-display').textContent = chips;
            document.getElementById('center-stage').innerHTML = `<span class="text-2xl font-black">${item.name}</span><br>${msg}`;
            setTimeout(() => {
                document.getElementById('center-stage').classList.remove('shake', 'flash');
            }, 1000);
        }
        init();
    </script>

    <div class="pb-6 flex flex-col items-center gap-3 w-full max-w-sm">
        <div class="flex items-center gap-2 bg-slate-800 p-3 rounded-xl border border-slate-600">
            <button onclick="changeBet(-100)" class="px-4 py-2 bg-slate-600 rounded text-white font-bold">-100</button>
            <div id="bet-display" class="w-20 text-center font-black text-xl text-yellow-300">100</div>
            <button onclick="changeBet(100)" class="px-4 py-2 bg-slate-600 rounded text-white font-bold">+100</button>
            <button onclick="changeBet(99999)" class="px-3 py-2 bg-red-800 rounded text-white font-bold">MAX</button>
        </div>
        <button id="start-btn" onclick="startSpin()" class="w-full py-4 bg-red-600 rounded-xl font-black text-2xl text-white shadow-[0_6px_0_#991b1b] active:shadow-none active:translate-y-[6px] transition-all">確認啟動 (100點)</button>
    </div>
</body>
</html>
