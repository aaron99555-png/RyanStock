<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飆股小瑪莉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #0f172a; overflow: hidden; touch-action: manipulation; font-family: sans-serif; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 6px;
            width: 95vmin;
            height: 95vmin;
            max-width: 600px;
            max-height: 600px;
        }
        .item { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10px; font-weight: 800; border-radius: 8px; border: 3px solid #334155; transition: all 0.1s; color: white; cursor: pointer; padding: 2px; }
        .active { transform: scale(1.1); box-shadow: 0 0 20px #fbbf24; border-color: white !important; z-index: 20; }
        #center-stage { grid-column: 2 / 7; grid-row: 2 / 7; border: 6px solid #475569; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 10px; text-align: center; background: #020617; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .shake { animation: shake 0.2s infinite; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col items-center justify-between p-2">
    <div class="text-center pt-2">
        <h1 class="text-3xl font-black text-yellow-400">飆股小瑪莉</h1>
        <div class="text-xl font-bold text-white">資本: <span id="chips-display" class="text-yellow-300">5000</span></div>
    </div>
    <div class="flex-1 flex items-center justify-center">
        <div id="game-board" class="grid-container bg-slate-900 p-2 rounded-2xl border-4 border-slate-700"></div>
    </div>
    <div class="pb-6 w-full max-w-sm px-4">
        <div class="flex items-center gap-2 bg-slate-800 p-2 rounded-xl mb-2">
            <button onclick="changeBet(-100)" class="px-4 py-2 bg-slate-600 rounded text-white">-100</button>
            <div id="bet-display" class="flex-1 text-center font-black text-xl text-yellow-300">100</div>
            <button onclick="changeBet(100)" class="px-4 py-2 bg-slate-600 rounded text-white">+100</button>
            <button onclick="changeBet(99999)" class="px-3 py-2 bg-red-800 rounded text-white">MAX</button>
        </div>
        <button id="start-btn" onclick="startSpin()" class="w-full py-3 bg-red-600 rounded-xl font-black text-xl text-white">確認啟動</button>
    </div>

    <script>
        // 依照順時針順序編排的陣列
        const ITEMS = [
            { name: 'TSMC', type: 'stock', gain: 200, reason: '台積電製程領先，營收創高，穩健獲利！' },
            { name: '漲停', type: 'good', gain: 500, reason: '今日買氣爆棚，強勢漲停板！' },
            { name: '鴻海', type: 'stock', gain: 200, reason: 'AI伺服器出貨強勁，股價穩步推升。' },
            { name: '軋空行情', type: 'good', gain: 500, reason: '空軍投降，行情軋到飛上天！' },
            { name: '聯發科', type: 'stock', gain: 200, reason: '天璣系列晶片市佔提升，大單入手。' },
            { name: '投信連買', type: 'good', gain: 500, reason: '法人籌碼鎖定，資金行情發酵。' },
            { name: '國巨', type: 'stock', gain: 200, reason: '被動元件需求回溫，獲利結構改善。' },
            { name: '跳空鎖死', type: 'good', gain: 500, reason: '開盤直接鎖死，賣盤全無！' },
            { name: '南亞科', type: 'stock', gain: 200, reason: 'DRAM報價反彈，營運好轉中。' },
            { name: '漲停', type: 'good', gain: 500, reason: '連拉兩根漲停，市場資金湧入！' },
            { name: '尖點', type: 'stock', gain: 200, reason: '鑽針需求穩定，業績持穩。' },
            { name: '金爺降臨', type: 'jackpot', gain: 5000, reason: '股神降臨！無敵大飆股！' },
            { name: '台達電', type: 'stock', gain: 200, reason: '節能減碳商機，電力設備接單強。' },
            { name: '外資倒貨', type: 'bad', loss: 300, reason: '外資提款，賣壓沉重，股價下挫。' },
            { name: '華碩', type: 'stock', gain: 200, reason: '電競筆電出貨旺，搶佔市佔率。' },
            { name: '胖手指', type: 'bad', loss: 300, reason: '交易員下錯單，引發程式賣壓。' },
            { name: '聯電', type: 'stock', gain: 200, reason: '成熟製程需求疲軟，遭調節，賠錢。' },
            { name: '高檔倒貨', type: 'bad', loss: 300, reason: '主力趁高獲利了結，散戶接盤。' },
            { name: '長榮', type: 'stock', gain: 200, reason: '運價維持高檔，獲利表現優異。' },
            { name: '相信哲哲', type: 'zhezhe', loss: 0.5, reason: '財富對折！這就是哲哲的力量！' },
            { name: '廣達', type: 'stock', gain: 200, reason: 'AI代工訂單滿載，後勢看好。' },
            { name: '融資斷頭', type: 'bad', loss: 300, reason: '融資成數過高，多殺多崩跌。' },
            { name: '法會大跌', type: 'bad', loss: 300, reason: '公司法說會利空，股價跳水。' },
            { name: '直雲大家族', type: 'super_bad', loss: 5000, reason: '慘！全村的希望都賠光了！' }
        ];

        let chips = 5000, bet = 100, isSpinning = false;
        const board = document.getElementById('game-board');

        function init() {
            // 建立 7x7 網格索引：0-23 順時針繞行
            const map = [
                0, 1, 2, 3, 4, 5, 6, 23, null, null, null, null, 7, 22, null, null, null, null, 8, 21, null, null, null, null, 9, 20, 19, 18, 17, 16, 15, 14, 13, 12, 11, 10
            ];
            // 為了簡化，直接將 24 個 item 依序放入 grid
            for(let i=0; i<24; i++) {
                const el = document.createElement('div');
                el.className = `item bg-slate-700`;
                el.id = `item-${i}`;
                el.innerHTML = ITEMS[i].name;
                board.appendChild(el);
            }
            board.innerHTML += `<div id="center-stage">準備好了嗎？</div>`;
        }

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            if(type === 'spin') { osc.type = 'square'; osc.frequency.value = 400; g.gain.value = 0.1; osc.start(); osc.stop(ctx.currentTime + 0.05); }
            else if(type === 'win') { osc.type = 'sine'; osc.frequency.setValueAtTime(500, ctx.currentTime); osc.frequency.linearRampToValueAtTime(1000, ctx.currentTime + 0.2); g.gain.value = 0.3; osc.start(); osc.stop(ctx.currentTime + 0.3); }
            else { osc.type = 'sawtooth'; osc.frequency.value = 100; g.gain.value = 0.3; osc.start(); osc.stop(ctx.currentTime + 0.3); }
        }

        function changeBet(val) {
            if(isSpinning) return;
            if(val === 99999) bet = chips;
            else bet = Math.max(100, Math.min(chips, bet + val));
            document.getElementById('bet-display').textContent = bet;
        }

        async function startSpin() {
            if(isSpinning || chips < bet) return;
            isSpinning = true; chips -= bet;
            document.getElementById('chips-display').textContent = chips;
            
            let pos = 0, steps = 30 + Math.floor(Math.random() * 20);
            function loop() {
                document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
                const currentId = pos % 24;
                document.getElementById(`item-${currentId}`).classList.add('active');
                playSound('spin');
                pos++; steps--;
                if(steps > 0) setTimeout(loop, 40 + (steps * 5));
                else finish(currentId);
            }
            loop();
        }

        function finish(idx) {
            const item = ITEMS[idx];
            let msg = item.name + "<br><span class='text-sm'>" + item.reason + "</span>";
            let delta = 0;
            if(item.type === 'zhezhe') delta = -Math.floor(chips / 2);
            else if(item.gain) delta = item.gain * (bet / 100);
            else if(item.loss) delta = -item.loss * (bet / 100);
            else if(item.type === 'super_bad') delta = -5000;

            chips += (delta + bet);
            document.getElementById('chips-display').textContent = chips;
            document.getElementById('center-stage').innerHTML = msg;
            if(delta < 0) { document.getElementById('center-stage').classList.add('shake'); playSound('lose'); }
            else { playSound('win'); }
            setTimeout(() => document.getElementById('center-stage').classList.remove('shake'), 1000);
            isSpinning = false;
        }
        init();
    </script>
</body>
</html>
