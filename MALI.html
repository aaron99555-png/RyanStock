<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飆股小瑪莉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #0f172a; overflow: hidden; touch-action: manipulation; }
        /* 使用 7x7 網格，中間留給舞台 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 4px;
            width: 95vmin;
            height: 95vmin;
            max-width: 550px;
            max-height: 550px;
        }
        .item { 
            display: flex; align-items: center; justify-content: center; text-align: center; 
            font-size: 10px; font-weight: bold; border-radius: 6px; border: 2px solid #334155; 
            transition: all 0.05s; color: white; padding: 2px;
        }
        .active { transform: scale(1.1); box-shadow: 0 0 20px #fbbf24; border-color: white !important; z-index: 10; filter: brightness(1.5); }
        #center-stage { grid-column: 2 / 7; grid-row: 2 / 7; border: 4px solid #475569; border-radius: 12px; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col items-center justify-between p-2">

    <div class="text-center pt-4">
        <h1 class="text-4xl font-black text-yellow-400 drop-shadow-md tracking-widest">飆股小瑪莉</h1>
        <div class="text-xl font-bold text-yellow-200 mt-1">資本: <span id="chips-display">5000</span></div>
    </div>

    <!-- 遊戲機台 -->
    <div class="flex-1 flex items-center justify-center">
        <div id="game-board" class="grid-container bg-slate-900 p-2 rounded-2xl border-4 border-slate-700"></div>
    </div>

    <!-- 控制區 -->
    <div class="pb-6 flex flex-col items-center gap-2 w-full max-w-sm">
        <div class="flex items-center gap-2 bg-slate-800 p-3 rounded-xl border border-slate-600">
            <button onclick="changeBet(-100)" class="px-4 py-2 bg-slate-600 rounded text-white font-bold">-100</button>
            <div id="bet-display" class="w-20 text-center font-bold text-lg text-white">100</div>
            <button onclick="changeBet(100)" class="px-4 py-2 bg-slate-600 rounded text-white font-bold">+100</button>
            <button onclick="changeBet(5000)" class="px-3 py-2 bg-red-800 rounded text-white font-bold">MAX</button>
        </div>
        <button id="spin-btn" onclick="startSpin()" class="w-full py-4 bg-red-600 rounded-xl font-black text-2xl text-white shadow-[0_6px_0_#991b1b] active:shadow-none active:translate-y-[6px] transition-all">確認啟動</button>
    </div>

<script>
    // 陣列順序依照：從左上角開始，順時針繞行一圈，共 24 格
    const ITEMS = [
        { name: 'TSMC', type: 'stock', color: 'bg-red-600' }, { name: '漲停', type: 'good', color: 'bg-red-600' },
        { name: '鴻海', type: 'stock', color: 'bg-blue-600' }, { name: '軋空行情', type: 'good', color: 'bg-pink-500' },
        { name: '聯發科', type: 'stock', color: 'bg-red-500' }, { name: '投信連買', type: 'good', color: 'bg-pink-600' },
        { name: '國巨', type: 'stock', color: 'bg-teal-600' }, { name: '跳空鎖死', type: 'good', color: 'bg-red-500' },
        { name: '南亞科', type: 'stock', color: 'bg-blue-600' }, { name: '漲停', type: 'good', color: 'bg-red-600' },
        { name: '尖點', type: 'stock', color: 'bg-indigo-600' }, { name: '金爺降臨', type: 'jackpot', color: 'bg-yellow-400' },
        { name: '台達電', type: 'stock', color: 'bg-blue-700' }, { name: '外資倒貨', type: 'bad', color: 'bg-green-500' },
        { name: '華碩', type: 'stock', color: 'bg-blue-400' }, { name: '胖手指', type: 'bad', color: 'bg-green-700' },
        { name: '聯電', type: 'stock', color: 'bg-orange-500' }, { name: '高檔倒貨', type: 'bad', color: 'bg-green-500' },
        { name: '長榮', type: 'stock', color: 'bg-teal-700' }, { name: '相信哲哲', type: 'zhezhe', color: 'bg-cyan-600' },
        { name: '廣達', type: 'stock', color: 'bg-blue-500' }, { name: '融資斷頭', type: 'bad', color: 'bg-green-800' },
        { name: '法會大跌', type: 'bad', color: 'bg-green-600' }, { name: '直雲大家族', type: 'super_bad', color: 'bg-black' }
    ];

    let chips = 5000, bet = 100, isSpinning = false;
    const board = document.getElementById('game-board');

    function init() {
        // 定位映射：7x7 矩陣，外圈順時針座標
        const layout = [
            0, 1, 2, 3, 4, 5, 6,
            23, null, null, null, null, null, 7,
            22, null, null, null, null, null, 8,
            21, null, null, null, null, null, 9,
            20, null, null, null, null, null, 10,
            19, null, null, null, null, null, 11,
            18, 17, 16, 15, 14, 13, 12
        ];
        layout.forEach((idx, i) => {
            if(idx !== null) {
                const el = document.createElement('div');
                el.className = `item ${ITEMS[idx].color}`;
                el.id = `item-${idx}`;
                el.innerHTML = ITEMS[idx].name;
                board.appendChild(el);
            } else if (i === 24) { } 
        });
        board.innerHTML += `<div id="center-stage" class="bg-slate-950 flex flex-col items-center justify-center text-yellow-400 font-bold p-4 text-center">請按下確認啟動</div>`;
    }

    function changeBet(val) { 
        if(val > 4000) bet = chips;
        else bet = Math.max(100, Math.min(chips, bet + val)); 
        document.getElementById('bet-display').textContent = bet; 
    }

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        if(type === 'spin') { osc.frequency.value = 300; g.gain.setValueAtTime(0.05, ctx.currentTime); }
        else if(type === 'win') { osc.frequency.value = 600; g.gain.setValueAtTime(0.2, ctx.currentTime); }
        else { osc.frequency.value = 100; g.gain.setValueAtTime(0.3, ctx.currentTime); }
        osc.start(); osc.stop(ctx.currentTime + 0.1);
    }

    async function startSpin() {
        if(isSpinning || chips < bet) return;
        isSpinning = true; chips -= bet;
        document.getElementById('chips-display').textContent = chips;
        let pos = 0, steps = 30 + Math.floor(Math.random() * 20);
        function loop() {
            document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
            document.getElementById(`item-${pos % 24}`).classList.add('active');
            playSound('spin');
            pos++; steps--;
            if(steps > 0) setTimeout(loop, 40 + (steps * 5));
            else { isSpinning = false; finish(pos % 24); }
        }
        loop();
    }

    function finish(idx) {
        const item = ITEMS[idx];
        let delta = 0, msg = "";
        if(item.type === 'jackpot') { delta = bet * 50; msg = "金爺降臨！大獎！"; playSound('win'); }
        else if(item.type === 'good') { delta = bet * 4; msg = "賺錢！"; playSound('win'); }
        else if(item.type === 'bad') { delta = -bet * 2; msg = "賠錢！"; playSound('lose'); }
        else if(item.type === 'super_bad') { delta = -5000; msg = "加入直雲大家族！"; playSound('lose'); }
        else if(item.type === 'zhezhe') { delta = -Math.floor(chips / 2); msg = "財富對折！"; playSound('lose'); }
        else { delta = 0; msg = "平盤"; }
        chips += (delta + bet);
        document.getElementById('chips-display').textContent = chips;
        document.getElementById('center-stage').textContent = `${item.name}\n${msg}`;
    }
    init();
</script>
</body>
</html>
