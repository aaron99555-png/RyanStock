<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飆股小瑪莉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #0f172a; overflow: hidden; touch-action: manipulation; font-family: sans-serif; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
            width: 95vmin;
            height: 95vmin;
            max-width: 600px;
            max-height: 600px;
        }
        .item { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 900; border-radius: 12px; border: 4px solid #1e293b; transition: all 0.1s; color: white; padding: 4px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .active { transform: scale(1.1); box-shadow: 0 0 25px #fbbf24; border-color: white !important; z-index: 20; }
        #center-stage { grid-column: 2 / 6; grid-row: 2 / 6; border: 8px solid #334155; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 20px; text-align: center; background: #020617; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .shake { animation: shake 0.2s infinite; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col items-center justify-between p-2">
    <div class="text-center pt-2">
        <h1 class="text-4xl font-black text-yellow-400 drop-shadow-lg">飆股小瑪莉</h1>
        <div class="text-2xl font-bold text-white mt-1">資本: <span id="chips-display" class="text-yellow-300">5000</span></div>
    </div>
    <div class="flex-1 flex items-center justify-center">
        <div id="game-board" class="grid-container bg-slate-900 p-3 rounded-3xl border-8 border-slate-700"></div>
    </div>
    <div class="pb-6 w-full max-w-sm px-4">
        <div class="flex items-center gap-2 bg-slate-800 p-3 rounded-2xl mb-3 border border-slate-600">
            <button onclick="changeBet(-100)" class="px-6 py-3 bg-slate-600 rounded-xl text-white font-bold hover:bg-slate-500">-100</button>
            <div id="bet-display" class="flex-1 text-center font-black text-2xl text-yellow-300">100</div>
            <button onclick="changeBet(100)" class="px-6 py-3 bg-slate-600 rounded-xl text-white font-bold hover:bg-slate-500">+100</button>
            <button onclick="changeBet(99999)" class="px-4 py-3 bg-red-900 rounded-xl text-white font-bold">MAX</button>
        </div>
        <button id="start-btn" onclick="startSpin()" class="w-full py-4 bg-red-600 rounded-2xl font-black text-2xl text-white shadow-[0_5px_0_#991b1b] hover:bg-red-500 active:shadow-none active:translate-y-[5px]">確認啟動</button>
    </div>

    <script>
        const ITEMS = [
            { name: 'TSMC', color: 'bg-blue-600', gain: 200, reason: '台積電製程領先，營收創高！' },
            { name: '漲停', color: 'bg-red-600', gain: 500, reason: '今日買氣爆棚，強勢漲停！' },
            { name: '鴻海', color: 'bg-purple-600', gain: 200, reason: 'AI伺服器出貨強勁。' },
            { name: '軋空行情', color: 'bg-red-500', gain: 500, reason: '空軍投降，行情飛上天！' },
            { name: '聯發科', color: 'bg-orange-600', gain: 200, reason: '晶片市佔提升，大單入手。' },
            { name: '投信連買', color: 'bg-pink-600', gain: 500, reason: '法人籌碼鎖定，資金行情發酵。' },
            { name: '國巨', color: 'bg-teal-600', gain: 200, reason: '被動元件需求回溫。' },
            { name: '跳空鎖死', color: 'bg-red-700', gain: 500, reason: '開盤直接鎖死，賣盤全無！' },
            { name: '南亞科', color: 'bg-sky-600', gain: 200, reason: 'DRAM報價反彈。' },
            { name: '漲停', color: 'bg-red-600', gain: 500, reason: '連拉兩根漲停！' },
            { name: '尖點', color: 'bg-indigo-600', gain: 200, reason: '鑽針需求穩定。' },
            { name: '金爺降臨', color: 'bg-yellow-500', gain: 5000, reason: '股神降臨！無敵大飆股！' },
            { name: '台達電', color: 'bg-emerald-600', gain: 200, reason: '節能商機強勁。' },
            { name: '外資倒貨', color: 'bg-green-700', loss: 300, reason: '外資提款，賣壓沉重。' },
            { name: '華碩', color: 'bg-blue-500', gain: 200, reason: '電競筆電出貨旺。' },
            { name: '胖手指', color: 'bg-green-600', loss: 300, reason: '交易員下錯單，引發賣壓。' },
            { name: '聯電', color: 'bg-blue-700', gain: 200, reason: '成熟製程獲利持穩。' },
            { name: '高檔倒貨', color: 'bg-emerald-800', loss: 300, reason: '主力獲利了結。' },
            { name: '長榮', color: 'bg-cyan-600', gain: 200, reason: '運價維持高檔。' },
            { name: '相信哲哲', color: 'bg-lime-600', type: 'zhezhe', reason: '財富對折！這就是力量！' },
            { name: '廣達', color: 'bg-rose-600', gain: 200, reason: 'AI代工訂單滿載。' },
            { name: '融資斷頭', color: 'bg-green-800', loss: 300, reason: '多殺多崩跌。' },
            { name: '法會大跌', color: 'bg-green-900', loss: 300, reason: '公司法說利空，股價跳水。' },
            { name: '直雲大家族', color: 'bg-red-950', type: 'super_bad', reason: '慘！全村希望都賠光了！' }
        ];

        let chips = 5000, bet = 100, isSpinning = false;
        const board = document.getElementById('game-board');

        function init() {
            for(let i=0; i<24; i++) {
                const el = document.createElement('div');
                el.className = `item ${ITEMS[i].color}`;
                el.id = `item-${i}`;
                el.innerHTML = ITEMS[i].name;
                board.appendChild(el);
            }
            board.innerHTML += `<div id="center-stage">準備好飆股了嗎？</div>`;
        }

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            g.gain.setValueAtTime(0.2, ctx.currentTime);
            if(type === 'spin') { osc.frequency.value = 400; osc.start(); osc.stop(ctx.currentTime + 0.05); }
            else if(type === 'win') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }
            else { osc.type = 'sawtooth'; osc.frequency.value = 100; g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); }
        }

        function changeBet(val) {
            if(isSpinning) return;
            if(val === 99999) bet = chips;
            else bet = Math.max(100, Math.min(chips, bet + val));
            document.getElementById('bet-display').textContent = bet;
        }

        async function startSpin() {
            if(isSpinning || chips < bet) return;
            isSpinning = true; chips -= bet;
            document.getElementById('chips-display').textContent = chips;
            let pos = 0, steps = 30 + Math.floor(Math.random() * 20);
            function loop() {
                document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
                const id = pos % 24;
                document.getElementById(`item-${id}`).classList.add('active');
                playSound('spin');
                pos++; steps--;
                if(steps > 0) setTimeout(loop, 40 + (steps * 4));
                else finish(id);
            }
            loop();
        }

        function finish(idx) {
            const item = ITEMS[idx];
            let delta = 0;
            if(item.type === 'zhezhe') delta = -Math.floor(chips / 2);
            else if(item.gain) delta = item.gain * (bet / 100);
            else if(item.loss) delta = -item.loss * (bet / 100);
            else if(item.type === 'super_bad') delta = -5000;
            
            chips += (delta + bet);
            document.getElementById('chips-display').textContent = chips;
            document.getElementById('center-stage').innerHTML = `<div class='text-2xl font-black'>${item.name}</div><div class='text-sm mt-2'>${item.reason}</div><div class='text-xl mt-2 font-bold ${delta >= 0 ? 'text-yellow-400' : 'text-red-400'}'>${delta >= 0 ? '+' : ''}${delta}</div>`;
            if(delta < 0) { document.getElementById('center-stage').classList.add('shake'); playSound('lose'); }
            else { playSound('win'); }
            setTimeout(() => document.getElementById('center-stage').classList.remove('shake'), 1000);
            isSpinning = false;
        }
        init();
    </script>
</body>
</html>
