<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飆股小瑪莉</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 增加一些自定義動畫與效果 */
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .animate-pulse-fast {
            animation: pulse-fast 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        /* 移除按鈕的反白選取 */
        button {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-900 flex flex-col items-center justify-center p-4 font-sans text-white overflow-hidden">

    <!-- 頂部標題與籌碼區 -->
    <div class="mb-6 text-center">
        <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-red-600 filter drop-shadow-[0_0_10px_rgba(255,0,0,0.8)] tracking-widest mb-2" style="-webkit-text-stroke: 1px #4a0000;">
            飆股小瑪莉
        </h1>
        <div class="flex gap-4 justify-center items-center text-xl font-bold bg-gray-800 p-2 rounded-xl border border-gray-700 shadow-inner">
            <div class="text-yellow-400">資本額: <span id="chips-display" class="text-2xl">$1000</span></div>
            <div id="last-win-display" class="hidden text-green-500">
                <!-- 將透過 JS 填入贏錢或輸錢的數字 -->
            </div>
        </div>
    </div>

    <!-- 遊戲機台主體 -->
    <div class="relative bg-gray-800 p-4 md:p-8 rounded-3xl border-8 border-gray-700 shadow-[0_20px_50px_rgba(0,0,0,0.8)]">
        <!-- 內圈發光裝飾 -->
        <div class="absolute inset-2 border border-gray-600 rounded-2xl pointer-events-none"></div>
        
        <!-- 小瑪莉網格佈局 (7x7 網格，中間挖空) -->
        <div id="game-board" class="grid grid-cols-7 grid-rows-7 gap-1 md:gap-2 w-[360px] h-[360px] md:w-[650px] md:h-[650px] relative z-10">
            
            <!-- 中間顯示螢幕 (佔據中間的 5x5 區域) -->
            <div class="col-start-2 col-end-7 row-start-2 row-end-7 bg-black rounded-xl border-4 border-gray-600 p-4 flex flex-col items-center justify-center shadow-inner relative overflow-hidden">
                <!-- 螢幕掃描線特效 (CRT Effect) -->
                <div class="absolute inset-0 bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] bg-[length:100%_4px,3px_100%] pointer-events-none"></div>
                
                <h2 id="center-message" class="text-2xl md:text-3xl font-black text-center z-10 transition-colors duration-300 text-white drop-shadow-md">
                    請下單！
                </h2>
            </div>
            
            <!-- JavaScript 將會在這裡動態產生周圍的 16 個方塊 -->
            
        </div>
    </div>

    <!-- 控制面板 -->
    <div class="mt-8 flex flex-col items-center gap-4">
        <button id="spin-btn" onclick="startSpin()" class="px-8 py-4 rounded-full font-black text-2xl tracking-widest text-white shadow-[0_10px_0_#7f1d1d,0_15px_20px_rgba(0,0,0,0.4)] transition-all bg-gradient-to-b from-red-500 to-red-700 active:shadow-[0_0px_0_#7f1d1d] active:translate-y-[10px] hover:brightness-110">
            下單 (100點)
        </button>
        <div id="bankrupt-msg" class="hidden mt-2 text-red-500 font-bold animate-bounce text-xl">
            破產啦！請重新整理網頁再戰。
        </div>
    </div>

    <script>
        const GAME_ITEMS = [
            { id: 'item-0', name: 'TSMC', type: 'stock', color: 'bg-red-600', text: 'text-white' }, // 上1
            { id: 'item-1', name: '跌停', type: 'bad', color: 'bg-green-600', text: 'text-white' }, // 上2
            { id: 'item-2', name: '鴻海', type: 'stock', color: 'bg-blue-700', text: 'text-white' }, // 上3
            { id: 'item-3', name: '跳空鎖死', type: 'event', color: 'bg-yellow-400', text: 'text-red-900' }, // 上4
            { id: 'item-4', name: '聯發科', type: 'stock', color: 'bg-red-500', text: 'text-white' }, // 上5
            { id: 'item-5', name: '外資倒貨', type: 'bad', color: 'bg-green-500', text: 'text-black' }, // 上6
            { id: 'item-6', name: '聯電', type: 'stock', color: 'bg-orange-500', text: 'text-white' }, // 上7
            
            { id: 'item-7', name: '軋空行情', type: 'good', color: 'bg-pink-600', text: 'text-white' }, // 右1
            { id: 'item-8', name: '南亞科', type: 'stock', color: 'bg-blue-600', text: 'text-white' }, // 右2
            { id: 'item-9', name: '漲停', type: 'good', color: 'bg-red-600', text: 'text-yellow-300' }, // 右3
            { id: 'item-10', name: '廣達', type: 'stock', color: 'bg-purple-600', text: 'text-white' }, // 右4
            { id: 'item-11', name: '違約交割', type: 'bad', color: 'bg-gray-900', text: 'text-red-500' }, // 右5
            
            { id: 'item-12', name: '國巨', type: 'stock', color: 'bg-teal-600', text: 'text-white' }, // 下1 (右下往左)
            { id: 'item-13', name: '投信連買', type: 'good', color: 'bg-pink-400', text: 'text-black' }, // 下2
            { id: 'item-14', name: '富邦金', type: 'stock', color: 'bg-cyan-600', text: 'text-white' }, // 下3
            { id: 'item-15', name: '融資斷頭', type: 'bad', color: 'bg-green-700', text: 'text-black' }, // 下4
            { id: 'item-16', name: '金爺降臨', type: 'jackpot', color: 'bg-yellow-300', text: 'text-red-600' }, // 下5
            { id: 'item-17', name: '台達電', type: 'stock', color: 'bg-blue-500', text: 'text-white' }, // 下6
            { id: 'item-18', name: '長榮', type: 'stock', color: 'bg-emerald-800', text: 'text-white' }, // 下7
            
            { id: 'item-19', name: '漲停', type: 'good', color: 'bg-red-600', text: 'text-yellow-300' }, // 左1 (左下往上)
            { id: 'item-20', name: '尖點', type: 'stock', color: 'bg-indigo-500', text: 'text-white' }, // 左2
            { id: 'item-21', name: '量價背離', type: 'event', color: 'bg-gray-700', text: 'text-yellow-300' }, // 左3
            { id: 'item-22', name: '華碩', type: 'stock', color: 'bg-red-800', text: 'text-white' }, // 左4
            { id: 'item-23', name: '跌停', type: 'bad', color: 'bg-green-600', text: 'text-white' }  // 左5
        ];

        // 7x7 網格中的座標定位 (Tailwind grid classes)
        const gridPositions = [
            'col-start-1 row-start-1', 'col-start-2 row-start-1', 'col-start-3 row-start-1', 'col-start-4 row-start-1', 'col-start-5 row-start-1', 'col-start-6 row-start-1', 'col-start-7 row-start-1', // 上排 0-6
            'col-start-7 row-start-2', 'col-start-7 row-start-3', 'col-start-7 row-start-4', 'col-start-7 row-start-5', 'col-start-7 row-start-6', // 右側 7-11
            'col-start-7 row-start-7', 'col-start-6 row-start-7', 'col-start-5 row-start-7', 'col-start-4 row-start-7', 'col-start-3 row-start-7', 'col-start-2 row-start-7', 'col-start-1 row-start-7', // 下排 12-18 (反向)
            'col-start-1 row-start-6', 'col-start-1 row-start-5', 'col-start-1 row-start-4', 'col-start-1 row-start-3', 'col-start-1 row-start-2'  // 左側 19-23 (反向)
        ];

        // 遊戲狀態變數
        let chips = 1000;
        let isSpinning = false;
        let currentIndex = -1; // 尚未開始
        let stepsLeft = 0;
        let speed = 50;
        let timer = null;

        // 初始化：動態建立外圈 16 個方塊
        function initBoard() {
        // 初始化：動態建立外圈方塊
        function initBoard() {
            const board = document.getElementById('game-board');
            
            GAME_ITEMS.forEach((item, index) => {
                const el = document.createElement('div');
                el.id = item.id;
                
                // 我們用 tailwind 的 grid 定位，所以把 el 當成 grid 的子元素
                // 為了塞入 7x7，字體稍微調小
                el.className = `flex items-center justify-center text-center font-bold text-[10px] md:text-[15px] rounded-md shadow-[inset_0_-2px_0_rgba(0,0,0,0.5)] border md:border-2 border-gray-900 transition-all duration-75 brightness-75 opacity-80 ${item.color} ${item.text} ${gridPositions[index]}`;
                
                el.innerHTML = `<div class="p-0.5 md:p-1 leading-tight tracking-tight md:tracking-wider" style="text-shadow: 1px 1px 2px black;">${item.name}</div>`;
                board.appendChild(el);
            });
            
            // 預設高亮第一個位置 (但不算遊戲開始)
            currentIndex = 0;
            highlightCell(currentIndex);
        }

        // 高亮指定的格子，並取消上一個高亮
        function highlightCell(index) {
            // 清除所有高亮
            GAME_ITEMS.forEach(item => {
                const el = document.getElementById(item.id);
                // 移除發光樣式，加回暗色
                el.classList.remove('scale-110', 'ring-4', 'ring-yellow-400', 'z-20', 'brightness-150', 'drop-shadow-[0_0_15px_rgba(255,255,0,0.8)]');
                el.classList.add('brightness-75', 'opacity-80');
            });

            // 加上高亮樣式
            const targetEl = document.getElementById(GAME_ITEMS[index].id);
            targetEl.classList.remove('brightness-75', 'opacity-80');
            targetEl.classList.add('scale-110', 'ring-4', 'ring-yellow-400', 'z-20', 'brightness-150', 'drop-shadow-[0_0_15px_rgba(255,255,0,0.8)]');
        }

        // 開始旋轉
        function startSpin() {
            if (isSpinning || chips < 100) return;

            // 扣除籌碼
            updateChips(-100);
            hideLastWin();
            
            isSpinning = true;
            
            // 更新 UI 狀態
            const msgEl = document.getElementById('center-message');
            msgEl.innerText = '交易中...';
            msgEl.className = 'text-2xl md:text-3xl font-black text-center z-10 transition-colors duration-300 text-yellow-400 animate-pulse-fast drop-shadow-md';
            
            const btn = document.getElementById('spin-btn');
            btn.classList.add('bg-gray-600', 'shadow-[0_5px_0_#4b5563]', 'translate-y-1', 'cursor-not-allowed');
            btn.classList.remove('bg-gradient-to-b', 'from-red-500', 'to-red-700', 'active:shadow-[0_0px_0_#7f1d1d]', 'active:translate-y-[10px]', 'hover:brightness-110');
            btn.innerText = '交易中...';

            // 設定總步數 (至少跑 3 圈 48格，加上隨機停點)
            const minSteps = GAME_ITEMS.length * 3;
            const randomStop = Math.floor(Math.random() * GAME_ITEMS.length);
            stepsLeft = minSteps + randomStop;
            
            // 初始極速
            speed = 30;
            
            if(timer) clearTimeout(timer);
            runAnimation();
        }

        // 跑馬燈遞迴迴圈
        function runAnimation() {
            if (stepsLeft <= 0) {
                // 停止旋轉
                isSpinning = false;
                handleResult(GAME_ITEMS[currentIndex]);
                return;
            }

            // 往下走一格
            currentIndex = (currentIndex + 1) % GAME_ITEMS.length;
            highlightCell(currentIndex);
            
            stepsLeft--;

            // 減速邏輯
            if (stepsLeft < 10) {
                speed += 40; // 快結束時快速變慢
            } else if (stepsLeft < 20) {
                speed += 20;
            } else if (stepsLeft < 35) {
                speed += 5;
            }

            timer = setTimeout(runAnimation, speed);
        }

        // 處理結果與結算
        function handleResult(item) {
            let winAmount = 0;
            let message = '';
            const msgEl = document.getElementById('center-message');
            
            // 根據類型決定賠率與訊息
            switch (item.type) {
                case 'jackpot':
                    winAmount = 5000;
                    message = `🎊 狂賀！\n【${item.name}】\n大賺 5000 點！`;
                    msgEl.className = 'text-2xl md:text-3xl font-black text-center z-10 transition-colors duration-300 text-yellow-300 drop-shadow-[0_0_8px_rgba(255,215,0,1)]';
                    break;
                case 'good':
                    winAmount = 500;
                    message = `🚀 恭喜！\n【${item.name}】\n賺 500 點！`;
                    msgEl.className = 'text-xl md:text-3xl font-black text-center z-10 transition-colors duration-300 text-red-500';
                    break;
                case 'stock':
                    winAmount = 200;
                    message = `📈 買進\n【${item.name}】\n賺 200 點！`;
                    msgEl.className = 'text-xl md:text-3xl font-black text-center z-10 transition-colors duration-300 text-red-400';
                    break;
                case 'event':
                    winAmount = 0;
                    message = `⚠️ 注意！\n【${item.name}】\n不賺不賠。`;
                    msgEl.className = 'text-xl md:text-3xl font-black text-center z-10 transition-colors duration-300 text-white';
                    break;
                case 'bad':
                    winAmount = -300;
                    message = `📉 慘了！\n【${item.name}】\n慘賠 300 點！`;
                    msgEl.className = 'text-xl md:text-3xl font-black text-center z-10 transition-colors duration-300 text-green-500';
                    break;
            }

            // 更新訊息
            msgEl.innerHTML = message.replace(/\n/g, '<br>');
            
            // 結算籌碼
            updateChips(winAmount);
            showLastWin(winAmount);

            // 恢復按鈕狀態
            const btn = document.getElementById('spin-btn');
            btn.classList.remove('bg-gray-600', 'shadow-[0_5px_0_#4b5563]', 'translate-y-1', 'cursor-not-allowed');
            btn.classList.add('bg-gradient-to-b', 'from-red-500', 'to-red-700', 'active:shadow-[0_0px_0_#7f1d1d]', 'active:translate-y-[10px]', 'hover:brightness-110');
            btn.innerText = '下單 (100點)';

            // 檢查破產
            if (chips < 100) {
                document.getElementById('bankrupt-msg').classList.remove('hidden');
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.onclick = null; // 移除點擊事件
            }
        }

        // 更新籌碼顯示
        function updateChips(amount) {
            chips += amount;
            document.getElementById('chips-display').innerText = `$${chips}`;
        }

        // 顯示上局贏虧
        function showLastWin(amount) {
            const el = document.getElementById('last-win-display');
            if (amount === 0) return;
            
            el.classList.remove('hidden', 'text-red-500', 'text-green-500');
            if (amount > 0) {
                el.classList.add('text-red-500'); // 台股紅色是漲
                el.innerText = `▲ ${amount}`;
            } else {
                el.classList.add('text-green-500'); // 台股綠色是跌
                el.innerText = `▼ ${Math.abs(amount)}`;
            }
        }

        // 隱藏上局贏虧
        function hideLastWin() {
            document.getElementById('last-win-display').classList.add('hidden');
        }

        // 網頁載入後初始化遊戲版面
        window.onload = () => {
            initBoard();
        };

    </script>
</body>
</html>
